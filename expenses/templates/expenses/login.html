
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #ede9fe, #fce7f3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 65px;
            height: 65px;
            background: #4f46e5;
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 18px;
        }

        h2 {
            color: #1e1b4b;
            font-weight: bold;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .login-btn {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #3730a3;
            color: white;
            transform: translateY(-2px);
        }

        .register-link {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #dc2626;
            font-size: 13px;
            padding-left: 18px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">₹</div>

    <h2 class="text-center">Welcome Back!</h2>

    <p class="text-center text-muted mb-4">
        Login to manage your expenses
    </p>

    {% if form.errors %}
        <div class="alert alert-danger">
            Invalid username or password.
            Please try again.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold">
                Username
            </label>

            {{ form.username }}
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">
                Password
            </label>

            {{ form.password }}
        </div>

        <button type="submit" class="login-btn">
            Login →
        </button>

    </form>

    <p class="text-center mt-4 mb-0">
        Don't have an account?
        <a href="{% url 'register' %}" class="register-link">
            Create Account
        </a>
    </p>

</div>

<script>
    document.querySelectorAll("input").forEach(function(input) {
        input.classList.add("form-control");

        if (input.name === "username") {
            input.placeholder = "Enter your username";
        }

        if (input.name === "password") {
            input.placeholder = "Enter your password";
        }
    });
</script>

</body>
</html>
